name: Track upstream projects

on:
  schedule:
    - cron: "0 1 * * 1"  # Mondays 01:00 UTC (09:00 Beijing)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-upstream
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh upstream status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/track_upstream.py

      - name: Commit generated status if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/upstream-status.md
          if git diff --cached --quiet; then
            echo "No status changes to commit."
            exit 0
          fi
          git commit -m "chore: 更新上游项目状态"
          git push
